# Fork-only: watches yetone/magpie for commits feat/mirasim hasn't taken in.
# It publishes a non-mutating trial merge report in the Summary and artifact,
# and tries an optional "Upstream updates" issue. It never pushes refs or
# installs an app. Main's mirror and product merges stay maintainer actions.
name: upstream watch

on:
  schedule:
    - cron: '17 1 * * *' # 09:17 UTC+8
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: true

jobs:
  watch:
    if: github.repository != 'yetone/magpie'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Upstream updates
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mirasim
          fetch-depth: 0

      - name: Compare with upstream
        id: cmp
        run: |
          git remote add upstream https://github.com/yetone/magpie.git
          git fetch --quiet --tags upstream main
          python3 scripts/test-report-upstream.py
          python3 scripts/report-upstream.py --output "$RUNNER_TEMP/upstream-report.md"
          cat "$RUNNER_TEMP/upstream-report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "new=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: upstream-report
          path: ${{ runner.temp }}/upstream-report.*
          retention-days: 30

      - name: Update optional issue
        continue-on-error: true
        env:
          NEW: ${{ steps.cmp.outputs.new }}
        run: |
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[] | select(.title == "Upstream updates" and .pull_request == null) | .number' | head -1)
          if [ "$NEW" = 0 ]; then
            if [ -n "$issue" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" -f state=closed; fi
            exit 0
          fi
          if [ -n "$issue" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" -f body=@"$RUNNER_TEMP/upstream-report.md" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="$TITLE" -f body=@"$RUNNER_TEMP/upstream-report.md" >/dev/null
          fi
